domain: android-logcat
summary: "A UI test scrolls through a warmed-up list and completes all input acknowledgements."
realLog: false
tier: realistic
provenance: authored
scenarioTags: [android, no-fault]
rootCauseCategory: no-fault
analysisQuestion: "Is there evidence of a UI stall or dropped input?"
expectRefusal: true
realismChecklist:
  lineFormat: "adb logcat -v threadtime with local month-day, millisecond clock, PID, TID, level and tag."
  noiseRatio: "379 of 379 lines are routine traffic (100.0%). Incident, symptom and distraction lines are excluded from the numerator."
  distractors: "No-fault exemption. The buffer only has app frame acknowledgements."
  rootCauseDiscoverability: "Consecutive input acknowledgements and frame IDs plus sub-14 ms latency support continuing progress."
  timeline: "One logcat clock. Input and frame IDs advance throughout the scroll test."
  sensitiveData: "All hosts, processes, samples and identifiers were authored for the fixture. No personal data, real serial numbers or credentials."
  annotationReview: "Cross-checked the first, middle and final acknowledgements and dropped counters. No generalized claim about app health is required. Independent review (2026-11-18): ok. All 379 input acknowledgements and frame IDs are consecutive, with 7.8–13.8 ms reported latency and zero drops."
