domain: android-logcat
summary: "An input dispatch timeout spans a synchronous MediaIndex Binder request."
realLog: false
tier: realistic
provenance: authored
scenarioTags: [android, multi-file, distractor]
rootCauseCategory: software-fault
analysisQuestion: "Where did the input thread stop making progress?"
rootCausePoints:
  - "The settings main thread waited synchronously for Binder transaction 935."
  - "MediaIndex thread 1924 held catalogLock across the input timeout and the reply followed lock release."
keyEvidenceLines: [142, 154, 370, 371, 372, 384, 387, 388]
expectedActions:
  - "Collect app and MediaIndex thread stacks for the same transaction ID."
  - "Move the settings query off the input thread and review how long the rebuild holds catalogLock."
bundleFiles: [fixtures/system.log, fixtures/binder.log]
keyEvidence:
  - { file: system.log, line: 142 }
  - { file: system.log, line: 154 }
  - { file: binder.log, line: 115 }
  - { file: binder.log, line: 116 }
  - { file: binder.log, line: 117 }
  - { file: binder.log, line: 129 }
  - { file: binder.log, line: 132 }
  - { file: binder.log, line: 133 }
realismChecklist:
  lineFormat: "adb logcat -v threadtime with local month-day, millisecond clock, PID, TID, level and tag."
  noiseRatio: "448 of 457 lines are routine traffic (98.0%). Incident, symptom and distraction lines are excluded from the numerator."
  distractors: "An offscreen-layer fence warning at system.log:56 involves SurfaceFlinger and no Binder ID from the ANR chain."
  rootCauseDiscoverability: "ANR text only reports a timeout. Transaction ID, TIDs and lock release/reply identify the blocked chain."
  timeline: "Both logcat buffers use the same clock. Lock claim, request, ANR, release and reply are ordered on it."
  sensitiveData: "All hosts, processes, samples and identifiers were authored for the fixture. No personal data, real serial numbers or credentials."
  annotationReview: "Matched transaction 935 and the relevant process and thread IDs across both files. The proposed fixes address the synchronous caller and the lock owner. Independent review (2026-11-18): fixed. Added the originating settings query to connect the caller to transaction 935. The transaction, contention and post-release reply span the five-second input timeout."
