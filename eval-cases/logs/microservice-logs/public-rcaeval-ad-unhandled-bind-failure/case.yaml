rootCauseCategory: software-fault
rootCausePoints:
  - AdService startup lets the listener bind exception escape the main thread.
  - The listener fails because address 0.0.0.0 port 15000 is already in use.
keyEvidenceLines: [169, 173, 175]
expectedActions:
  - Identify the process already holding port 15000 and correct the listener configuration.
  - Handle startup bind failures explicitly and verify the ad service can start and serve requests.
