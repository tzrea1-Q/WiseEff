domain: microservice-logs
summary: Online Boutique's ad service exits during startup after a listener conflict.
realLog: false
tier: realistic
provenance: public-dataset
scenarioTags: [public-labelled, cascade]
datasetSource:
  name: RCAEval RE3-OB (Online Boutique)
