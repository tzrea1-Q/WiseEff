# Deterministic evaluation validates the evaluation pipeline and fixture behavior.
# It does not measure live model quality or provider drift. Real-provider evaluation
# remains a separately authorized run with a validated corpus and protected secrets.
name: Log analysis quality gate

on:
  workflow_dispatch:
  schedule:
    # Weekly deterministic regression check: Mondays 02:30 UTC.
    - cron: "30 2 * * 1"

permissions:
  contents: read

concurrency:
  group: log-analysis-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-eval:
    name: Quality-layer eval (deterministic)
    runs-on: ubuntu-latest
    # Bound deterministic regression work; investigate failures rather than retry indefinitely.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality-layer eval (gated)
        env:
          LOG_ANALYSIS_DETERMINISTIC: "true"
        run: npm run logs:eval:quality
      - name: Upload quality report and judge sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-analysis-quality-report
          path: |
            docs/generated/log-analysis-quality.json
            docs/generated/log-analysis-quality.md
            docs/generated/log-analysis-judge-sample.md
          if-no-files-found: error
          retention-days: 14
