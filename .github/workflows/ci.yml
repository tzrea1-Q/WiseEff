name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly L1 + L2 on main (UTC).
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: Acceptance mode for manual synthetic runs.
        required: true
        default: local-non-hdc
        type: choice
        options:
          - local-non-hdc
          - target-non-hdc
          - full-pilot
          - minimal-upgrade
      frontend_url:
        description: Target frontend URL for target-non-HDC or full-pilot synthetic runs.
        required: false
        type: string
      env_file:
        description: Environment file to create for target synthetic runs.
        required: false
        default: .env.target.local
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  EFF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  EFF_MODE: ${{ inputs.acceptance_mode }}
  EFF_FULL_ACCEPTANCE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-acceptance') }}

jobs:
  minimal-upgrade:
    name: Minimal upgrade terminal probe
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_mode == 'minimal-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare the real browser CLI
        run: |
          npm install --global @playwright/cli@0.1.14
          google-chrome --version
          sudo find /etc/apt/sources.list.d -iname '*chrome*' -delete -o -iname '*google*' -delete
          timeout 180s sudo apt-get update || true
          timeout 180s sudo apt-get install --no-install-recommends -y fontconfig fonts-noto-cjk
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-cn' | grep -F 'Noto Sans CJK'
      - name: Run the isolated fixed-source terminal probe
        run: npx tsx scripts/run-minimal-upgrade-acceptance.ts "$GITHUB_SHA" "$(docker info --format '{{.ID}}')"
      - name: Retain sanitized stage evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-upgrade-terminal-evidence
          path: /tmp/wiseeff-minimal-terminal-*/evidence.zip
          if-no-files-found: error
      - name: Package the exact changed source for review
        if: always()
        shell: bash
        run: |
          base=cda6737a8f177a8bbd2f3bc7d195f8e3037bfa74
          mkdir -p /tmp/minimal-upgrade-source
          mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$base" "$GITHUB_SHA")
          test "${#changed[@]}" -gt 0
          git diff --exit-code "$GITHUB_SHA" -- "${changed[@]}"
          git archive --format=tar "$GITHUB_SHA" -- "${changed[@]}" > /tmp/minimal-upgrade-source/source.tar
          git diff --binary "$base" "$GITHUB_SHA" > /tmp/minimal-upgrade-source/changes.diff
          sha256sum -- "${changed[@]}" > /tmp/minimal-upgrade-source/SHA256SUMS
          git show -s --format='candidate=%H%ntree=%T' "$GITHUB_SHA" > /tmp/minimal-upgrade-source/identity.txt
          echo "base=$base" >> /tmp/minimal-upgrade-source/identity.txt
      - name: Retain the review source package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-upgrade-source
          path: /tmp/minimal-upgrade-source/
          if-no-files-found: error

  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      run_l1: ${{ steps.paths.outputs.run_l1 }}
      run_quality: ${{ steps.paths.outputs.run_quality }}
      run_smoke: ${{ steps.paths.outputs.run_smoke }}
      run_l2: ${{ steps.paths.outputs.run_l2 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Retained rehearsal source lock on native Linux
        if: github.event_name == 'workflow_dispatch' && inputs.acceptance_mode == 'minimal-upgrade'
        run: npx vitest run --config vitest.scripts.config.ts scripts/wayfinder/parameter-catalog-rehearsal-source-lock.test.ts

      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          ACCEPTANCE_MODE: ${{ inputs.acceptance_mode }}
          FULL_ACCEPTANCE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-acceptance') }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
                | npx tsx scripts/ci-changed-paths.ts --stdin --github-output
              if [ "${FULL_ACCEPTANCE}" = "true" ]; then
                echo "run_l2=true" >> "$GITHUB_OUTPUT"
                echo "run_quality=true" >> "$GITHUB_OUTPUT"
              else
                echo "run_l2=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            push|schedule)
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "run_l1=true" >> "$GITHUB_OUTPUT"
              echo "run_quality=true" >> "$GITHUB_OUTPUT"
              echo "run_smoke=false" >> "$GITHUB_OUTPUT"
              echo "run_l2=true" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "run_l1=false" >> "$GITHUB_OUTPUT"
              echo "run_smoke=false" >> "$GITHUB_OUTPUT"
              if [ "${ACCEPTANCE_MODE}" = "local-non-hdc" ]; then
                echo "run_quality=true" >> "$GITHUB_OUTPUT"
                echo "run_l2=true" >> "$GITHUB_OUTPUT"
              else
                echo "run_quality=false" >> "$GITHUB_OUTPUT"
                echo "run_l2=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "run_l1=true" >> "$GITHUB_OUTPUT"
              echo "run_quality=true" >> "$GITHUB_OUTPUT"
              echo "run_smoke=true" >> "$GITHUB_OUTPUT"
              echo "run_l2=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Documentation governance
        run: npm run docs:check

  l1-static:
    name: L1 static and build
    needs: detect
    if: needs.detect.outputs.run_l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Cache ESLint
        id: eslint_cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package-lock.json') }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - name: Acceptance CI metadata (L1)
        id: metadata
        run: npm run acceptance:ci

      - name: Build
        id: build
        run: npm run build

      - name: UI standards ratchet
        id: ui
        run: npm run ui:check

      - name: Lint
        id: lint
        run: npm run lint

      - name: Verify parameter Catalog trusted base and boundary ratchet
        id: catalog
        env:
          PARAMETER_CATALOG_TRUSTED_BASE_SHA: 9b3ba7df7e21f5589684bc92c872da593ad4c246
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${PARAMETER_CATALOG_TRUSTED_BASE_SHA}"
          test "$(git rev-parse --verify "${PARAMETER_CATALOG_TRUSTED_BASE_SHA}^{commit}")" = "${PARAMETER_CATALOG_TRUSTED_BASE_SHA}"
          npm run parameter-catalog-boundaries:check -- --trusted-base-sha "${PARAMETER_CATALOG_TRUSTED_BASE_SHA}"

      - name: Contract check
        id: contract
        run: npm run contract:check

      - name: Log analysis behavior eval
        id: logs
        run: npm run logs:eval

      - name: Record complete L1 invocation
        id: receipt
        if: always()
        env:
          EFF_STEPS: ${{ toJSON(steps) }}
        run: node --experimental-strip-types scripts/ci-required-results.ts receipt

  l1-frontend:
    name: L1 frontend
    needs: detect
    if: needs.detect.outputs.run_l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Frontend tests
        id: frontend
        run: node --experimental-strip-types scripts/ci-required-results.ts test frontend
      - name: Record complete L1 invocation
        id: receipt
        if: always()
        env:
          EFF_STEPS: ${{ toJSON(steps) }}
        run: node --experimental-strip-types scripts/ci-required-results.ts receipt

  l1-scripts:
    name: L1 scripts and bridge
    needs: detect
    if: needs.detect.outputs.run_l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiseeff
          POSTGRES_PASSWORD: wiseeff
          POSTGRES_DB: wiseeff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiseeff -d wiseeff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://wiseeff:wiseeff@127.0.0.1:5432/wiseeff
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Install and verify DTS toolchain
        id: toolchain
        uses: ./.github/actions/setup-dts-toolchain
      - name: Advisory DTS seed compile (dtc)
        id: advisory
        continue-on-error: true
        run: npm run dtc:seed:compile
      - name: Enable pgvector extension
        id: vector
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query("create extension if not exists vector");
            const row = await client.query(
              "select extname from pg_extension where extname = $1",
              ["vector"],
            );
            if (row.rowCount !== 1) {
              throw new Error("pgvector extension was not created");
            }
            await client.end();
          '
      - name: Script tests
        id: scripts
        run: node --experimental-strip-types scripts/ci-required-results.ts test scripts
      - name: Device bridge tests
        id: bridge
        run: node --experimental-strip-types scripts/ci-required-results.ts test bridge
      - name: Record complete L1 invocation
        id: receipt
        if: always()
        env:
          EFF_STEPS: ${{ toJSON(steps) }}
        run: node --experimental-strip-types scripts/ci-required-results.ts receipt

  l1-server:
    name: L1 backend
    needs: detect
    if: needs.detect.outputs.run_l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiseeff
          POSTGRES_PASSWORD: wiseeff
          POSTGRES_DB: wiseeff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiseeff -d wiseeff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://wiseeff:wiseeff@127.0.0.1:5432/wiseeff
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Install and verify DTS toolchain
        id: toolchain
        uses: ./.github/actions/setup-dts-toolchain
      - name: Enable pgvector extension
        id: vector
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query("create extension if not exists vector");
            const row = await client.query(
              "select extname from pg_extension where extname = $1",
              ["vector"],
            );
            if (row.rowCount !== 1) {
              throw new Error("pgvector extension was not created");
            }
            await client.end();
          '
      - name: Documentation governance
        id: docs
        run: npm run docs:check

      - name: Backend tests
        id: server
        run: node --experimental-strip-types scripts/ci-required-results.ts test server
      - name: Record complete L1 invocation
        id: receipt
        if: always()
        env:
          EFF_STEPS: ${{ toJSON(steps) }}
        run: node --experimental-strip-types scripts/ci-required-results.ts receipt

  build-and-test:
    name: Build and test
    if: always()
    needs: [detect, l1-static, l1-frontend, l1-scripts, l1-server]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      identity: ${{ steps.results.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify every required L1 result and invocation
        id: results
        env:
          EFF_NEEDS: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/ci-required-results.ts l1

  acceptance-quality:
    name: Acceptance quality
    needs: detect
    if: needs.detect.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiseeff
          POSTGRES_PASSWORD: wiseeff
          POSTGRES_DB: wiseeff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiseeff -d wiseeff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://wiseeff:wiseeff@127.0.0.1:5432/wiseeff
      WISEEFF_API_BASE_URL: http://127.0.0.1:8787
      VITE_WISEEFF_RUNTIME_MODE: api
      VITE_WISEEFF_API_BASE_URL: http://127.0.0.1:8787
      WISEEFF_ACCEPTANCE_FRONTEND_URL: http://127.0.0.1:5173
      OBJECT_STORE_MODE: local
      OBJECT_STORE_ROOT: .wiseeff-object-store
      DEVICE_GATEWAY_ALLOW_SIMULATOR_IN_PRODUCTION: "true"
      XIAOZE_DETERMINISTIC: "true"
      AUTH_MODE: production
      AUTH_PROVIDER: hmac
      M5_CONTRACT_CHECK_PASSED: "true"
      M5_SMOKE_ALLOW_NO_API: "false"
      # Shared acceptance DB is post-cutover. M1 seed runs local finalize
      # when WISEEFF_SEED_LEGACY_FLAT_IDENTITY is unset.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare local acceptance env
        shell: bash
        run: |
          cp .env.example .env
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "AUTH_MODE=production"
            echo "AUTH_PROVIDER=hmac"
            echo "XIAOZE_DETERMINISTIC=true"
            echo "XIAOZE_LLM_API_BASE_URL=http://127.0.0.1:8787"
            echo "XIAOZE_LLM_MODEL=wiseeff-rules-m4"
            echo "XIAOZE_LLM_API_KEY=local-ci-deterministic"
            echo "OBJECT_STORE_MODE=local"
            echo "OBJECT_STORE_ROOT=.wiseeff-object-store"
            echo "WISEEFF_API_BASE_URL=http://127.0.0.1:8787"
            echo "VITE_WISEEFF_API_BASE_URL=http://127.0.0.1:8787"
            echo "VITE_WISEEFF_RUNTIME_MODE=api"
            echo "DEVICE_GATEWAY_ALLOW_SIMULATOR_IN_PRODUCTION=true"
            echo "M5_CONTRACT_CHECK_PASSED=true"
          } >> .env
          sed -i 's/^XIAOZE_PROACTIVE_ENABLED=.*/XIAOZE_PROACTIVE_ENABLED=true/' .env

      - name: Migrate and seed database
        run: |
          npm run db:migrate
          npm run db:seed:all
          echo "WISEEFF_QUALITY_SKIP_SEED=true" >> "$GITHUB_ENV"
          echo "WISEEFF_QUALITY_ALLOW_VISUAL_FIXTURE=true" >> "$GITHUB_ENV"
          echo "WISEEFF_QUALITY_FIXTURE_DATABASE_NAME=wiseeff" >> "$GITHUB_ENV"

      - name: Acceptance quality metadata
        run: npm run acceptance:quality

      - name: Acceptance quality gates
        run: npm run acceptance:quality-run

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-acceptance-quality
          path: |
            playwright-report/quality
            test-results/quality

  acceptance-smoke:
    name: Acceptance smoke
    needs: detect
    if: needs.detect.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiseeff
          POSTGRES_PASSWORD: wiseeff
          POSTGRES_DB: wiseeff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiseeff -d wiseeff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://wiseeff:wiseeff@127.0.0.1:5432/wiseeff
      WISEEFF_API_BASE_URL: http://127.0.0.1:8787
      VITE_WISEEFF_RUNTIME_MODE: api
      VITE_WISEEFF_API_BASE_URL: http://127.0.0.1:8787
      WISEEFF_ACCEPTANCE_FRONTEND_URL: http://127.0.0.1:5173
      OBJECT_STORE_MODE: local
      OBJECT_STORE_ROOT: .wiseeff-object-store
      DEVICE_GATEWAY_ALLOW_SIMULATOR_IN_PRODUCTION: "true"
      XIAOZE_DETERMINISTIC: "true"
      AUTH_MODE: production
      AUTH_PROVIDER: hmac
      M5_CONTRACT_CHECK_PASSED: "true"
      M5_SMOKE_ALLOW_NO_API: "false"
      WISEEFF_ACCEPTANCE_EVIDENCE_RUN_ID: focused-ci-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install and verify DTS toolchain
        uses: ./.github/actions/setup-dts-toolchain

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare local acceptance env
        shell: bash
        run: |
          cp .env.example .env
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "AUTH_MODE=production"
            echo "AUTH_PROVIDER=hmac"
            echo "XIAOZE_DETERMINISTIC=true"
            echo "XIAOZE_LLM_API_BASE_URL=http://127.0.0.1:8787"
            echo "XIAOZE_LLM_MODEL=wiseeff-rules-m4"
            echo "XIAOZE_LLM_API_KEY=local-ci-deterministic"
            echo "OBJECT_STORE_MODE=local"
            echo "OBJECT_STORE_ROOT=.wiseeff-object-store"
            echo "WISEEFF_API_BASE_URL=http://127.0.0.1:8787"
            echo "VITE_WISEEFF_API_BASE_URL=http://127.0.0.1:8787"
            echo "VITE_WISEEFF_RUNTIME_MODE=api"
            echo "DEVICE_GATEWAY_ALLOW_SIMULATOR_IN_PRODUCTION=true"
            echo "M5_CONTRACT_CHECK_PASSED=true"
            echo "WISEEFF_ACCEPTANCE_EVIDENCE_RUN_ID=focused-ci-smoke"
          } >> .env
          sed -i 's/^XIAOZE_PROACTIVE_ENABLED=.*/XIAOZE_PROACTIVE_ENABLED=true/' .env

      - name: Migrate and seed database
        run: |
          npm run db:migrate
          npm run db:seed:all

      - name: Acceptance smoke
        run: npm run acceptance:smoke

  acceptance-local-non-hdc:
    name: Acceptance local non-HDC
    needs: detect
    if: needs.detect.outputs.run_l2 == 'true'
    runs-on: ubuntu-latest
    # Enforced by acceptance:ci: 5m platform overhead + 71m bounded prelude
    # + the 60m Gate0 owner + 5m safety scan + 5m upload = 146m. The job
    # + 1m identity + 4m diagnostic generation/fallback/upload/settlement = 151m.
    # Keep the job budget strictly greater than the complete platform path.
    timeout-minutes: 155

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiseeff
          POSTGRES_PASSWORD: wiseeff
          POSTGRES_DB: wiseeff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiseeff -d wiseeff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://wiseeff:wiseeff@127.0.0.1:5432/wiseeff

    steps:
      - name: Check out repository
        timeout-minutes: 5
        uses: actions/checkout@v4

      - name: Observe acceptance execution identity
        id: acceptance_execution_identity
        timeout-minutes: 1
        shell: /usr/bin/python3 -I {0}
        run: |
          import os, re, subprocess, sys
          try:
              values = []
              for ref in ("HEAD", "HEAD^{tree}"):
                  result = subprocess.run(["/usr/bin/git", "rev-parse", "--verify", ref],
                                          capture_output=True, timeout=10, check=True)
                  value = result.stdout.decode("ascii").strip()
                  if not re.fullmatch(r"[0-9a-f]{40}", value):
                      raise ValueError()
                  values.append(value)
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("sha=" + values[0] + "\ntree=" + values[1] + "\n")
          except Exception:
              sys.exit("EXECUTION_IDENTITY_UNAVAILABLE")

      - name: Set up Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        timeout-minutes: 15
        run: npm ci

      - name: Install and verify DTS toolchain
        timeout-minutes: 20
        uses: ./.github/actions/setup-dts-toolchain

      - name: Advisory DTS seed compile (dtc)
        timeout-minutes: 3
        continue-on-error: true
        run: npm run dtc:seed:compile

      - name: Install Playwright Chromium
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Acceptance CI metadata
        timeout-minutes: 3
        run: npm run acceptance:ci

      - name: Acceptance state models
        timeout-minutes: 5
        run: npm run acceptance:models

      - name: Owned visual and browser acceptance Gate 0
        id: acceptance_gate0
        timeout-minutes: 65
        run: npm run acceptance:gate0

      - name: Acceptance artifact safety
        id: acceptance_artifact_safety
        if: always()
        timeout-minutes: 5
        run: npm run acceptance:artifacts:finalize -- --root test-results/acceptance-runtime-runs --output test-results/acceptance-runtime-upload/wiseeff-acceptance-local-non-hdc.zip

      - name: Upload acceptance evidence
        id: acceptance_evidence_upload
        if: always() && steps.acceptance_artifact_safety.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-acceptance-local-non-hdc
          path: test-results/acceptance-runtime-upload/wiseeff-acceptance-local-non-hdc.zip
          if-no-files-found: error
          compression-level: 0

      # Bootstrap publisher: only workflow-owned context, never candidate files,
      # reports, titles, paths, exceptions or environment dumps. Internal cleanup
      # and phase facts remain unknown until an accepted-base publisher exists.
      - name: Generate minimal acceptance diagnostic
        id: acceptance_diagnostic
        if: always()
        timeout-minutes: 1
        shell: /usr/bin/python3 -I {0}
        env:
          EFF_RUN_ID: ${{ github.run_id }}
          EFF_ATTEMPT: ${{ github.run_attempt }}
          EFF_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          EFF_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EFF_EXECUTED_SHA: ${{ steps.acceptance_execution_identity.outputs.sha }}
          EFF_TREE: ${{ steps.acceptance_execution_identity.outputs.tree }}
          EFF_EXECUTION: ${{ steps.acceptance_gate0.outcome }}
          EFF_ARCHIVE: ${{ steps.acceptance_artifact_safety.outcome }}
          EFF_UPLOAD: ${{ steps.acceptance_evidence_upload.outcome }}
        run: |
          import datetime, json, os, pathlib, re, sys, tempfile
          try:
              def identity(key, pattern):
                  value = os.environ.get(key, "")
                  if value == "":
                      return None
                  if not re.fullmatch(pattern, value):
                      raise ValueError()
                  return value

              def outcome(key):
                  value = os.environ.get(key, "")
                  if value not in ("", "success", "failure", "cancelled", "skipped"):
                      raise ValueError()
                  return value or "unknown"

              record = {
                  "schemaVersion": 1, "scope": "workflow-context-only",
                  "identity": {
                      "runId": identity("EFF_RUN_ID", r"[1-9][0-9]{0,19}"),
                      "attempt": identity("EFF_ATTEMPT", r"[1-9][0-9]{0,9}"),
                      "job": "acceptance-local-non-hdc",
                      "workflowSha": identity("EFF_WORKFLOW_SHA", r"[0-9a-f]{40}"),
                      "acceptedBase": identity("EFF_BASE", r"[0-9a-f]{40}"),
                      "prHead": identity("EFF_PR_HEAD", r"[0-9a-f]{40}"),
                      "executedSha": identity("EFF_EXECUTED_SHA", r"[0-9a-f]{40}"),
                      "tree": identity("EFF_TREE", r"[0-9a-f]{40}"),
                  },
                  "states": {
                      "execution": outcome("EFF_EXECUTION"), "cleanup": "unknown",
                      "diagnostic": "generated", "archive": outcome("EFF_ARCHIVE"),
                      "upload": outcome("EFF_UPLOAD"), "diagnosticUpload": "pending",
                  },
                  "firstFailedStage": None, "code": "WORKFLOW_SNAPSHOT",
                  "exitCode": None, "signal": None, "startedAt": None,
                  "recordedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "testCounts": None, "failureIds": [], "detailsSuppressed": True,
                  "missingEvidence": ["phase-details", "cleanup", "test-counts", "diagnostic-upload-terminal"],
              }
              for stage in ("execution", "archive", "upload"):
                  if record["states"][stage] == "failure":
                      record["firstFailedStage"] = stage
                      record["code"] = stage.upper() + "_FAILED"
                      break
              if record["states"]["execution"] in ("unknown", "skipped", "cancelled") or any(
                      value is None for value in record["identity"].values()):
                  record["code"] = "EXECUTION_INCOMPLETE"
              payload = json.dumps(record, indent=2) + "\n"
              summary = "Acceptance diagnostic: " + record["code"] + "\n\n" + json.dumps(record["states"]) + "\n"
              if len(payload.encode()) > 65536 or len(summary.encode()) > 4096:
                  raise ValueError()
              root = os.environ["RUNNER_TEMP"]
              if "\n" in root or "\r" in root:
                  raise ValueError()
              directory = pathlib.Path(tempfile.mkdtemp(prefix="wiseeff-diagnostic-", dir=root))
              destination = directory / "diagnostic.json"
              with destination.open("x") as output:
                  output.write(payload)
              destination.chmod(0o600)
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("path=" + str(destination) + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write(summary)
          except Exception:
              sys.exit("DIAGNOSTIC_REJECTED")

      - name: Generate fixed diagnostic rejection
        id: acceptance_diagnostic_fallback
        if: always() && steps.acceptance_diagnostic.outcome != 'success'
        timeout-minutes: 1
        shell: /usr/bin/python3 -I {0}
        env:
          EFF_RUN_ID: ${{ github.run_id }}
          EFF_ATTEMPT: ${{ github.run_attempt }}
        run: |
          import json, os, pathlib, re, sys, tempfile
          try:
              def number(key, pattern):
                  value = os.environ.get(key, "")
                  return value if re.fullmatch(pattern, value) else None
              record = {"schemaVersion": 1, "scope": "workflow-context-only",
                        "identity": {"runId": number("EFF_RUN_ID", r"[1-9][0-9]{0,19}"),
                                     "attempt": number("EFF_ATTEMPT", r"[1-9][0-9]{0,9}"),
                                     "job": "acceptance-local-non-hdc"},
                        "code": "DIAGNOSTIC_REJECTED", "detailsSuppressed": True}
              root = os.environ["RUNNER_TEMP"]
              if "\n" in root or "\r" in root:
                  raise ValueError()
              directory = pathlib.Path(tempfile.mkdtemp(prefix="wiseeff-diagnostic-rejected-", dir=root))
              destination = directory / "diagnostic.json"
              with destination.open("x") as output:
                  output.write(json.dumps(record) + "\n")
              destination.chmod(0o600)
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("path=" + str(destination) + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write("Acceptance diagnostic: DIAGNOSTIC_REJECTED\n")
          except Exception:
              sys.exit("DIAGNOSTIC_REJECTED")

      - name: Upload minimal acceptance diagnostic
        id: acceptance_diagnostic_upload
        if: always() && (steps.acceptance_diagnostic.outcome == 'success' || steps.acceptance_diagnostic_fallback.outcome == 'success')
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-acceptance-local-non-hdc
          path: ${{ steps.acceptance_diagnostic.outcome == 'success' && steps.acceptance_diagnostic.outputs.path || steps.acceptance_diagnostic_fallback.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Settle diagnostic upload outcome
        if: always()
        timeout-minutes: 1
        shell: /usr/bin/python3 -I {0}
        env:
          EFF_UPLOAD: ${{ steps.acceptance_diagnostic_upload.outcome }}
        run: |
          import os, sys
          try:
              status = os.environ.get("EFF_UPLOAD", "")
              if status not in ("success", "failure", "cancelled", "skipped"):
                  status = "unknown"
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write("Minimal diagnostic upload: " + status + "\n")
              if status != "success":
                  sys.exit(1)
          except Exception:
              sys.exit("DIAGNOSTIC_UPLOAD_INCOMPLETE")

  target-synthetic-acceptance:
    name: Target synthetic acceptance
    needs: detect
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_mode != 'local-non-hdc' && inputs.acceptance_mode != 'minimal-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      WISEEFF_API_BASE_URL: ${{ secrets.WISEEFF_API_BASE_URL }}
      VITE_WISEEFF_API_BASE_URL: ${{ secrets.WISEEFF_API_BASE_URL }}
      WISEEFF_ACCEPTANCE_FRONTEND_URL: ${{ inputs.frontend_url }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_MODE: production
      AUTH_TOKEN_ISSUER: ${{ secrets.AUTH_TOKEN_ISSUER }}
      AUTH_TOKEN_HMAC_SECRET: ${{ secrets.AUTH_TOKEN_HMAC_SECRET }}
      M5_SMOKE_AUTHORIZATION: ${{ secrets.M5_SMOKE_AUTHORIZATION }}
      WISEEFF_SMOKE_AUTHORIZATION: ${{ secrets.WISEEFF_SMOKE_AUTHORIZATION }}
      DEBUG_DEVICE_GATEWAY_MODE: ${{ vars.DEBUG_DEVICE_GATEWAY_MODE }}
      HDC_DEVICE_LAB_AVAILABLE: ${{ vars.HDC_DEVICE_LAB_AVAILABLE }}
      HDC_SMOKE_PROJECT_ID: ${{ vars.HDC_SMOKE_PROJECT_ID }}
      HDC_SMOKE_DEVICE_ID: ${{ vars.HDC_SMOKE_DEVICE_ID }}
      HDC_SMOKE_TARGET_REF: ${{ vars.HDC_SMOKE_TARGET_REF }}
      HDC_SMOKE_PARAMETER_ID: ${{ vars.HDC_SMOKE_PARAMETER_ID }}
      HDC_SMOKE_NODE_PATH: ${{ vars.HDC_SMOKE_NODE_PATH }}
      HDC_SMOKE_WRITE_VALUE: ${{ vars.HDC_SMOKE_WRITE_VALUE }}
      M5_DEVICE_GATEWAY_EVIDENCE: ${{ vars.M5_DEVICE_GATEWAY_EVIDENCE }}
      M5_BACKUP_RESTORE_DRILL_AT: ${{ vars.M5_BACKUP_RESTORE_DRILL_AT }}
      M5_CONTRACT_CHECK_PASSED: ${{ vars.M5_CONTRACT_CHECK_PASSED }}
      WISEEFF_QUALITY_SKIP_SEED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare target acceptance env
        shell: bash
        run: |
          target_env="${{ inputs.env_file }}"
          frontend_url="${WISEEFF_ACCEPTANCE_FRONTEND_URL:-https://example.invalid}"
          {
            echo "WISEEFF_API_BASE_URL=${WISEEFF_API_BASE_URL}"
            echo "VITE_WISEEFF_RUNTIME_MODE=api"
            echo "VITE_WISEEFF_API_BASE_URL=${VITE_WISEEFF_API_BASE_URL}"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "AUTH_MODE=production"
            echo "AUTH_TOKEN_ISSUER=${AUTH_TOKEN_ISSUER}"
            echo "AUTH_TOKEN_HMAC_SECRET=${AUTH_TOKEN_HMAC_SECRET}"
            echo "M5_SMOKE_AUTHORIZATION=${M5_SMOKE_AUTHORIZATION:-${WISEEFF_SMOKE_AUTHORIZATION}}"
            echo "WISEEFF_SMOKE_AUTHORIZATION=${WISEEFF_SMOKE_AUTHORIZATION:-${M5_SMOKE_AUTHORIZATION}}"
            echo "DEBUG_DEVICE_GATEWAY_MODE=${DEBUG_DEVICE_GATEWAY_MODE:-simulator}"
            echo "HDC_DEVICE_LAB_AVAILABLE=${HDC_DEVICE_LAB_AVAILABLE:-false}"
            echo "HDC_SMOKE_PROJECT_ID=${HDC_SMOKE_PROJECT_ID}"
            echo "HDC_SMOKE_DEVICE_ID=${HDC_SMOKE_DEVICE_ID}"
            echo "HDC_SMOKE_TARGET_REF=${HDC_SMOKE_TARGET_REF}"
            echo "HDC_SMOKE_PARAMETER_ID=${HDC_SMOKE_PARAMETER_ID}"
            echo "HDC_SMOKE_NODE_PATH=${HDC_SMOKE_NODE_PATH}"
            echo "HDC_SMOKE_WRITE_VALUE=${HDC_SMOKE_WRITE_VALUE}"
            echo "M5_DEVICE_GATEWAY_EVIDENCE=${M5_DEVICE_GATEWAY_EVIDENCE}"
            echo "M5_BACKUP_RESTORE_DRILL_AT=${M5_BACKUP_RESTORE_DRILL_AT}"
            echo "M5_CONTRACT_CHECK_PASSED=${M5_CONTRACT_CHECK_PASSED:-true}"
          } > "${target_env}"
          echo "WISEEFF_ACCEPTANCE_FRONTEND_URL=${frontend_url}" >> "$GITHUB_ENV"

      - name: Acceptance CI metadata
        run: npm run acceptance:ci

      - name: Acceptance state models
        run: npm run acceptance:models

      - name: Acceptance quality metadata
        run: npm run acceptance:quality

      - name: Acceptance quality gates
        run: npm run acceptance:quality-run
        env:
          WISEEFF_ACCEPTANCE_NO_START_RUNTIME: "true"

      - name: Browser acceptance target non-HDC
        if: inputs.acceptance_mode == 'target-non-hdc'
        run: npm run acceptance:browser -- --mode target-non-hdc --no-start-runtime --env-file "${{ inputs.env_file }}" --frontend-url "${WISEEFF_ACCEPTANCE_FRONTEND_URL}"

      - name: Browser acceptance full pilot
        if: inputs.acceptance_mode == 'full-pilot'
        run: npm run acceptance:browser -- --mode full-pilot --no-start-runtime --env-file "${{ inputs.env_file }}" --frontend-url "${WISEEFF_ACCEPTANCE_FRONTEND_URL}"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-acceptance-${{ inputs.acceptance_mode }}
          path: |
            playwright-report/acceptance
            test-results/acceptance
            docs/generated/acceptance-browser-evidence.md
            docs/generated/acceptance-operation-evidence.md
            docs/generated/acceptance-operation-evidence/index.json
            playwright-report/quality
            test-results/quality

  required:
    name: Merge bar
    if: always()
    needs:
      - detect
      - build-and-test
      - acceptance-quality
      - acceptance-smoke
      - acceptance-local-non-hdc
      - target-synthetic-acceptance
      - minimal-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check jobs that were supposed to run
        env:
          EFF_NEEDS: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/ci-required-results.ts required
