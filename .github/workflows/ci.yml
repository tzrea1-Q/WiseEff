name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Nightly L1 + L2 on main (UTC).
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: Acceptance mode for manual synthetic runs.
        required: true
        default: local-non-hdc
        type: choice
        options:
          - local-non-hdc
          - target-non-hdc
          - full-pilot
          - minimal-upgrade
      frontend_url:
        description: Target frontend URL for target-non-HDC or full-pilot synthetic runs.
        required: false
        type: string
      env_file:
        description: Environment file to create for target synthetic runs.
        required: false
        default: .env.target.local
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'full-acceptance') && github.run_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-acceptance') }}

permissions:
  contents: read

env:
  EFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  EFF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  EFF_MODE: ${{ inputs.acceptance_mode }}
  EFF_FULL_ACCEPTANCE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-acceptance') }}

jobs:
  minimal-upgrade:
    name: Minimal upgrade terminal probe
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_mode == 'minimal-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare the real browser CLI
        run: |
          npm install --global @playwright/cli@0.1.14
          google-chrome --version
          sudo find /etc/apt/sources.list.d -iname '*chrome*' -delete -o -iname '*google*' -delete
          timeout 180s sudo apt-get update || true
          timeout 180s sudo apt-get install --no-install-recommends -y fontconfig fonts-noto-cjk
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-cn' | grep -F 'Noto Sans CJK'
      - name: Run the isolated fixed-source terminal probe
        run: npx tsx scripts/run-minimal-upgrade-acceptance.ts "$GITHUB_SHA" "$(docker info --format '{{.ID}}')"
      - name: Retain sanitized stage evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-upgrade-terminal-evidence
          path: /tmp/wiseeff-minimal-terminal-*/evidence.zip
          if-no-files-found: error
      - name: Package the exact changed source for review
        if: always()
        shell: bash
        run: |
          base=cda6737a8f177a8bbd2f3bc7d195f8e3037bfa74
          mkdir -p /tmp/minimal-upgrade-source
          mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$base" "$GITHUB_SHA")
          test "${#changed[@]}" -gt 0
          git diff --exit-code "$GITHUB_SHA" -- "${changed[@]}"
          git archive --format=tar "$GITHUB_SHA" -- "${changed[@]}" > /tmp/minimal-upgrade-source/source.tar
          git diff --binary "$base" "$GITHUB_SHA" > /tmp/minimal-upgrade-source/changes.diff
          sha256sum -- "${changed[@]}" > /tmp/minimal-upgrade-source/SHA256SUMS
          git show -s --format='candidate=%H%ntree=%T' "$GITHUB_SHA" > /tmp/minimal-upgrade-source/identity.txt
          echo "base=$base" >> /tmp/minimal-upgrade-source/identity.txt
      - name: Retain the review source package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-upgrade-source
          path: /tmp/minimal-upgrade-source/
          if-no-files-found: error

  detect:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selected: ${{ steps.event.outputs.selected }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
      run_l1: ${{ steps.paths.outputs.run_l1 }}
      run_quality: ${{ steps.paths.outputs.run_quality }}
      run_smoke: ${{ steps.paths.outputs.run_smoke }}
      run_l2: ${{ steps.paths.outputs.run_l2 }}

    steps:
      - name: Select CI event
        id: event
        env:
          SELECTED: ${{ github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-acceptance' }}
        run: echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.event.outputs.selected == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.event.outputs.selected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.event.outputs.selected == 'true'
        run: npm ci

      - name: Retained rehearsal source lock on native Linux
        if: github.event_name == 'workflow_dispatch' && inputs.acceptance_mode == 'minimal-upgrade'
        run: npx vitest run --config vitest.scripts.config.ts scripts/wayfinder/parameter-catalog-rehearsal-source-lock.test.ts

      - name: Classify changed paths
        if: steps.event.outputs.selected == 'true'
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          ACCEPTANCE_MODE: ${{ inputs.acceptance_mode }}
          FULL_ACCEPTANCE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-acceptance') }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
                | npx tsx scripts/ci-changed-paths.ts --stdin --github-output
              if [ "${FULL_ACCEPTANCE}" = "true" ]; then
                echo "run_l2=true" >> "$GITHUB_OUTPUT"
                echo "run_quality=true" >> "$GITHUB_OUTPUT"
              else
                echo "run_l2=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            push|schedule)
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "run_l1=true" >> "$GITHUB_OUTPUT"
              echo "run_quality=true" >> "$GITHUB_OUTPUT"
              echo "run_smoke=false" >> "$GITHUB_OUTPUT"
              echo "run_l2=true" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "run_l1=false" >> "$GITHUB_OUTPUT"
              echo "run_smoke=false" >> "$GITHUB_OUTPUT"
              if [ "${ACCEPTANCE_MODE}" = "local-non-hdc" ]; then
                echo "run_quality=true" >> "$GITHUB_OUTPUT"
                echo "run_l2=true" >> "$GITHUB_OUTPUT"
              else
                echo "run_quality=false" >> "$GITHUB_OUTPUT"
                echo "run_l2=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "run_l1=true" >> "$GITHUB_OUTPUT"
              echo "run_quality=true" >> "$GITHUB_OUTPUT"
              echo "run_smoke=true" >> "$GITHUB_OUTPUT"
              echo "run_l2=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Record CI shadow scope
        if: steps.event.outputs.selected == 'true'
        id: shadow-summary
        run: node_modules/.bin/tsx scripts/verification/ci-shadow.ts --scope

      - name: Documentation governance
        if: steps.event.outputs.selected == 'true'
        run: npm run docs:check

  l1-static:
    name: L1 static and build
    needs: detect
    if: needs.detect.outputs.run_l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Cache ESLint
        id: eslint_cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package-lock.json') }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - name: Acceptance CI metadata (L1)
        id: metadata
        run: npm run acceptance:ci

      - name: Build
        id: build
        run: npm run build

      - name: UI standards ratchet
        id: ui
        run: npm run ui:check

      - name: Lint
        id: lint
        env:
          WISEEFF_STATIC_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          WISEEFF_NATIVE_BUILD_OUTCOME: ${{ steps.build.outcome }}
          WISEEFF_NATIVE_TYPECHECK_SHA: ${{ steps.build.outputs.native_typecheck_sha }}
        run: npm run lint

      - name: Verify parameter Catalog boundary baseline
        id: catalog
        run: |
          set -euo pipefail
          npm run parameter-catalog-boundaries:check
          npm run test:scripts -- scripts/check-parameter-catalog-boundaries.test.ts

      - name: Contract check
        id: contract
        run: npm run contract:check

      - name: Bridge package consistency
        id: bridge_package
        run: npm run bridge:package:check

      - name: Log analysis behavior eval
        id: logs
        run: npm run logs:eval

      - name: Record complete L1 invocation
        id: receipt
        if: always()
        env:
          EFF_STEPS: >-
            {"checkout":${{ toJSON(steps.checkout) }},
            "node":${{ toJSON(steps.node) }},
            "install":${{ toJSON(steps.install) }},
            "eslint_cache":${{ toJSON(steps.eslint_cache) }},
            "metadata":${{ toJSON(steps.metadata) }},
            "build":${{ toJSON(steps.build) }},
            "ui":${{ toJSON(steps.ui) }},
            "lint":${{ toJSON(steps.lint) }},
            "catalog":${{ toJSON(steps.catalog) }},
            "contract":${{ toJSON(steps.contract) }},
            "bridge_package":${{ toJSON(steps.bridge_package) }},
            "logs":${{ toJSON(steps.logs) }}}
        run: node --experimental-strip-types scripts/ci-required-results.ts receipt

  l1-frontend:
    name: L1 frontend
    needs: detect
    if: needs.detect.outputs.run_l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
      shadow_frontend: ${{ steps.frontend.outputs.shadow }}
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Frontend tests
        id: frontend
        run: node --experimental-strip-types scripts/ci-required-results.ts test frontend
      - name: Record complete L1 invocation
        id: receipt
        if: always()
        env:
          EFF_STEPS: >-
            {"checkout":${{ toJSON(steps.checkout) }},
            "node":${{ toJSON(steps.node) }},
            "install":${{ toJSON(steps.install) }},
            "frontend":${{ toJSON(steps.frontend) }}}
        run: node --experimental-strip-types scripts/ci-required-results.ts receipt

  l1-scripts:
    name: L1 scripts and bridge
    needs: detect
    if: needs.detect.outputs.run_l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
      shadow_scripts: ${{ steps.scripts.outputs.shadow }}
      shadow_bridge: ${{ steps.bridge.outputs.shadow }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiseeff
          POSTGRES_PASSWORD: wiseeff
          POSTGRES_DB: wiseeff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiseeff -d wiseeff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://wiseeff:wiseeff@127.0.0.1:5432/wiseeff
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Install and verify DTS toolchain
        id: toolchain
        uses: ./.github/actions/setup-dts-toolchain
      - name: Advisory DTS seed compile (dtc)
        id: advisory
        continue-on-error: true
        run: npm run dtc:seed:compile
      - name: Enable pgvector extension
        id: vector
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query("create extension if not exists vector");
            const row = await client.query(
              "select extname from pg_extension where extname = $1",
              ["vector"],
            );
            if (row.rowCount !== 1) {
              throw new Error("pgvector extension was not created");
            }
            await client.end();
          '
      - name: Script tests
        id: scripts
        env:
          # Compile cache only; this scripts step does not collect V8 coverage.
          NODE_COMPILE_CACHE: ${{ runner.temp }}/wiseeff-scripts-node-cache
        run: node --experimental-strip-types scripts/ci-required-results.ts test scripts
      - name: Device bridge tests
        id: bridge
        run: node --experimental-strip-types scripts/ci-required-results.ts test bridge
      - name: Record complete L1 invocation
        id: receipt
        if: always()
        env:
          EFF_STEPS: >-
            {"checkout":${{ toJSON(steps.checkout) }},
            "node":${{ toJSON(steps.node) }},
            "install":${{ toJSON(steps.install) }},
            "toolchain":${{ toJSON(steps.toolchain) }},
            "advisory":${{ toJSON(steps.advisory) }},
            "vector":${{ toJSON(steps.vector) }},
            "scripts":${{ toJSON(steps.scripts) }},
            "bridge":${{ toJSON(steps.bridge) }}}
        run: node --experimental-strip-types scripts/ci-required-results.ts receipt

  l1-server-shards:
    name: L1 backend shard ${{ matrix.shard }}/2
    needs: detect
    if: needs.detect.outputs.run_l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiseeff
          POSTGRES_PASSWORD: wiseeff
          # Deliberately not named `wiseeff`. The managed-instance publication
          # policy specs in this job refuse the shared compose app database on
          # loopback:5432 (server/testing/testDatabase.ts,
          # isForbiddenComposeAppPostgres), so this ephemeral, job-dedicated
          # service creates its own database for the backend suite instead.
          POSTGRES_DB: wiseeff_l1_server
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiseeff -d wiseeff_l1_server"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://wiseeff:wiseeff@127.0.0.1:5432/wiseeff_l1_server
      WISEEFF_CI_SERVER_SHARD: ${{ matrix.shard }}/2
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Install and verify DTS toolchain
        id: toolchain
        uses: ./.github/actions/setup-dts-toolchain
      - name: Enable pgvector extension
        id: vector
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query("create extension if not exists vector");
            const row = await client.query(
              "select extname from pg_extension where extname = $1",
              ["vector"],
            );
            if (row.rowCount !== 1) {
              throw new Error("pgvector extension was not created");
            }
            await client.end();
          '
      - name: Documentation governance
        id: docs
        run: npm run docs:check

      - name: Backend tests (duration-balanced inventory)
        id: server
        run: node --experimental-strip-types scripts/ci-required-results.ts test server
      - name: Record complete L1 invocation
        id: receipt
        if: always()
        env:
          EFF_STEPS: >-
            {"checkout":${{ toJSON(steps.checkout) }},
            "node":${{ toJSON(steps.node) }},
            "install":${{ toJSON(steps.install) }},
            "toolchain":${{ toJSON(steps.toolchain) }},
            "vector":${{ toJSON(steps.vector) }},
            "docs":${{ toJSON(steps.docs) }},
            "server":${{ toJSON(steps.server) }}}
        run: node --experimental-strip-types scripts/ci-required-results.ts receipt

      - name: Upload backend shard receipt
        id: shard_receipt
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-ci-server-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/wiseeff-ci-shard/receipt.json
          if-no-files-found: error

  l1-server:
    name: L1 backend
    if: always() && needs.detect.outputs.selected != 'false'
    needs: [detect, l1-server-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      receipt: ${{ steps.results.outputs.receipt }}
      shadow_server: ${{ steps.results.outputs.shadow }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        if: needs.detect.outputs.run_l1 == 'true'
        with:
          pattern: wiseeff-ci-server-*-*
          path: ${{ runner.temp }}/wiseeff-ci-shards
      - id: results
        env:
          EFF_NEEDS: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/ci-shard-results.ts aggregate server

  build-and-test:
    name: Build and test
    if: always() && needs.detect.outputs.selected != 'false'
    needs: [detect, l1-static, l1-frontend, l1-scripts, l1-server]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      identity: ${{ steps.results.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify every required L1 result and invocation
        id: results
        env:
          EFF_NEEDS: >-
            {"detect":${{ toJSON(needs.detect) }},
            "l1-static":{"result":${{ toJSON(needs.l1-static.result) }},"outputs":{"receipt":${{ toJSON(needs.l1-static.outputs.receipt) }}}},
            "l1-frontend":{"result":${{ toJSON(needs.l1-frontend.result) }},"outputs":{"receipt":${{ toJSON(needs.l1-frontend.outputs.receipt) }}}},
            "l1-scripts":{"result":${{ toJSON(needs.l1-scripts.result) }},"outputs":{"receipt":${{ toJSON(needs.l1-scripts.outputs.receipt) }}}},
            "l1-server":{"result":${{ toJSON(needs.l1-server.result) }},"outputs":{"receipt":${{ toJSON(needs.l1-server.outputs.receipt) }}}}}
          EFF_SHADOW: >-
            {"detect":${{ toJSON(needs.detect) }},
            "l1-frontend":{"result":${{ toJSON(needs.l1-frontend.result) }},"outputs":{"shadow_frontend":${{ toJSON(needs.l1-frontend.outputs.shadow_frontend) }}}},
            "l1-scripts":{"result":${{ toJSON(needs.l1-scripts.result) }},"outputs":{"shadow_scripts":${{ toJSON(needs.l1-scripts.outputs.shadow_scripts) }},"shadow_bridge":${{ toJSON(needs.l1-scripts.outputs.shadow_bridge) }}}},
            "l1-server":{"result":${{ toJSON(needs.l1-server.result) }},"outputs":{"shadow_server":${{ toJSON(needs.l1-server.outputs.shadow_server) }}}}}
        run: node --experimental-strip-types scripts/ci-required-results.ts l1

  acceptance-quality-lanes:
    name: Acceptance quality lane (${{ matrix.lane }})
    needs: detect
    if: needs.detect.outputs.run_quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [visual, consistency-1, consistency-2, accessibility]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiseeff
          POSTGRES_PASSWORD: wiseeff
          POSTGRES_DB: wiseeff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiseeff -d wiseeff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://wiseeff:wiseeff@127.0.0.1:5432/wiseeff
      WISEEFF_QUALITY_LANE: ${{ matrix.lane }}
      WISEEFF_API_BASE_URL: http://127.0.0.1:8787
      VITE_WISEEFF_RUNTIME_MODE: api
      VITE_WISEEFF_API_BASE_URL: http://127.0.0.1:8787
      WISEEFF_ACCEPTANCE_FRONTEND_URL: http://127.0.0.1:5173
      OBJECT_STORE_MODE: local
      OBJECT_STORE_ROOT: .wiseeff-object-store
      DEVICE_GATEWAY_ALLOW_SIMULATOR_IN_PRODUCTION: "true"
      XIAOZE_DETERMINISTIC: "true"
      AUTH_MODE: production
      AUTH_PROVIDER: hmac
      M5_CONTRACT_CHECK_PASSED: "true"
      M5_SMOKE_ALLOW_NO_API: "false"
      # Shared acceptance DB is post-cutover. M1 seed runs local finalize
      # when WISEEFF_SEED_LEGACY_FLAT_IDENTITY is unset.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Playwright version
        id: playwright_version
        timeout-minutes: 1
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare local acceptance env
        shell: bash
        run: |
          cp .env.example .env
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "AUTH_MODE=production"
            echo "AUTH_PROVIDER=hmac"
            echo "XIAOZE_DETERMINISTIC=true"
            echo "XIAOZE_LLM_API_BASE_URL=http://127.0.0.1:8787"
            echo "XIAOZE_LLM_MODEL=wiseeff-rules-m4"
            echo "XIAOZE_LLM_API_KEY=local-ci-deterministic"
            echo "OBJECT_STORE_MODE=local"
            echo "OBJECT_STORE_ROOT=.wiseeff-object-store"
            echo "WISEEFF_API_BASE_URL=http://127.0.0.1:8787"
            echo "VITE_WISEEFF_API_BASE_URL=http://127.0.0.1:8787"
            echo "VITE_WISEEFF_RUNTIME_MODE=api"
            echo "DEVICE_GATEWAY_ALLOW_SIMULATOR_IN_PRODUCTION=true"
            echo "M5_CONTRACT_CHECK_PASSED=true"
          } >> .env
          sed -i 's/^XIAOZE_PROACTIVE_ENABLED=.*/XIAOZE_PROACTIVE_ENABLED=true/' .env

      - name: Migrate and seed database
        run: |
          npm run seed:browser
          echo "WISEEFF_QUALITY_SKIP_SEED=true" >> "$GITHUB_ENV"
          if [ "$WISEEFF_QUALITY_LANE" = "visual" ]; then
            echo "WISEEFF_QUALITY_ALLOW_VISUAL_FIXTURE=true" >> "$GITHUB_ENV"
            echo "WISEEFF_QUALITY_FIXTURE_DATABASE_NAME=wiseeff" >> "$GITHUB_ENV"
          fi

      - name: Acceptance quality metadata
        run: npm run acceptance:quality

      - name: Acceptance quality gates
        run: node --experimental-strip-types scripts/ci-shard-results.ts quality

      - name: Upload quality lane receipt
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-ci-quality-${{ github.run_attempt }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/wiseeff-ci-shard/receipt.json
          if-no-files-found: error

      - name: Report quality gate runtime
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const reportPath = 'test-results/quality/results.json';
          const lane = process.env.WISEEFF_QUALITY_LANE;
          const summary = existsSync(reportPath)
            ? `Quality lane ${lane}${lane === 'visual' ? ' (including compact PC)' : ''}: ${(JSON.parse(readFileSync(reportPath, 'utf8')).stats.duration / 1000).toFixed(1)} seconds. CI job limit: 35 minutes.`
            : 'Quality gate runtime unavailable: Playwright did not produce its JSON report.';
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          NODE

      - name: Upload quality evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lane == 'visual' && 'wiseeff-acceptance-quality' || format('wiseeff-acceptance-quality-{0}', matrix.lane) }}
          path: |
            playwright-report/quality
            test-results/quality

      - name: Generate candidate baseline review
        if: failure() && matrix.lane == 'visual'
        run: npx tsx scripts/quality-baseline-review.ts "$RUNNER_TEMP/wiseeff-ci-shard/results.json"

      - name: Upload candidate baseline review
        if: failure() && matrix.lane == 'visual' && hashFiles('test-results/quality/baseline-review/candidate.patch') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-visual-baseline-review
          path: test-results/quality/baseline-review
          if-no-files-found: error

  acceptance-quality:
    name: Acceptance quality
    if: always() && needs.detect.outputs.selected != 'false'
    needs: [detect, acceptance-quality-lanes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      identity: ${{ steps.results.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        if: needs.detect.outputs.run_quality == 'true'
        with:
          pattern: wiseeff-ci-quality-*-*
          path: ${{ runner.temp }}/wiseeff-ci-shards
      - id: results
        env:
          EFF_NEEDS: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/ci-shard-results.ts aggregate quality

  acceptance-smoke:
    name: Acceptance smoke
    needs: detect
    if: needs.detect.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiseeff
          POSTGRES_PASSWORD: wiseeff
          POSTGRES_DB: wiseeff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiseeff -d wiseeff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://wiseeff:wiseeff@127.0.0.1:5432/wiseeff
      WISEEFF_API_BASE_URL: http://127.0.0.1:8787
      VITE_WISEEFF_RUNTIME_MODE: api
      VITE_WISEEFF_API_BASE_URL: http://127.0.0.1:8787
      WISEEFF_ACCEPTANCE_FRONTEND_URL: http://127.0.0.1:5173
      OBJECT_STORE_MODE: local
      OBJECT_STORE_ROOT: .wiseeff-object-store
      DEVICE_GATEWAY_ALLOW_SIMULATOR_IN_PRODUCTION: "true"
      XIAOZE_DETERMINISTIC: "true"
      AUTH_MODE: production
      AUTH_PROVIDER: hmac
      M5_CONTRACT_CHECK_PASSED: "true"
      M5_SMOKE_ALLOW_NO_API: "false"
      WISEEFF_ACCEPTANCE_EVIDENCE_RUN_ID: focused-ci-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install and verify DTS toolchain
        uses: ./.github/actions/setup-dts-toolchain

      - name: Read Playwright version
        id: playwright_version
        timeout-minutes: 1
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare local acceptance env
        shell: bash
        run: |
          cp .env.example .env
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "AUTH_MODE=production"
            echo "AUTH_PROVIDER=hmac"
            echo "XIAOZE_DETERMINISTIC=true"
            echo "XIAOZE_LLM_API_BASE_URL=http://127.0.0.1:8787"
            echo "XIAOZE_LLM_MODEL=wiseeff-rules-m4"
            echo "XIAOZE_LLM_API_KEY=local-ci-deterministic"
            echo "OBJECT_STORE_MODE=local"
            echo "OBJECT_STORE_ROOT=.wiseeff-object-store"
            echo "WISEEFF_API_BASE_URL=http://127.0.0.1:8787"
            echo "VITE_WISEEFF_API_BASE_URL=http://127.0.0.1:8787"
            echo "VITE_WISEEFF_RUNTIME_MODE=api"
            echo "DEVICE_GATEWAY_ALLOW_SIMULATOR_IN_PRODUCTION=true"
            echo "M5_CONTRACT_CHECK_PASSED=true"
            echo "WISEEFF_ACCEPTANCE_EVIDENCE_RUN_ID=focused-ci-smoke"
          } >> .env
          sed -i 's/^XIAOZE_PROACTIVE_ENABLED=.*/XIAOZE_PROACTIVE_ENABLED=true/' .env

      - name: Migrate and seed database
        run: |
          npm run seed:browser

      - name: Acceptance smoke
        run: npm run acceptance:smoke

  acceptance-local-non-hdc-shards:
    name: Acceptance local non-HDC shard ${{ matrix.shard }}/4
    needs: detect
    if: needs.detect.outputs.run_l2 == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Enforced per shard by acceptance:ci: 5m platform overhead + 72m prelude
    # (including identity) + 60m Gate0 owner + 5m safety scan + 5m upload
    # + 4m diagnostic generation/fallback/upload/settlement = 151m.
    # Keep the job budget strictly greater than the complete platform path.
    timeout-minutes: 155

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wiseeff
          POSTGRES_PASSWORD: wiseeff
          POSTGRES_DB: wiseeff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiseeff -d wiseeff"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://wiseeff:wiseeff@127.0.0.1:5432/wiseeff

    steps:
      - name: Check out repository
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Observe acceptance execution identity
        id: acceptance_execution_identity
        timeout-minutes: 1
        shell: /usr/bin/python3 -I {0}
        run: |
          import os, re, subprocess, sys
          try:
              values = []
              for ref in ("HEAD", "HEAD^{tree}"):
                  result = subprocess.run(["/usr/bin/git", "rev-parse", "--verify", ref],
                                          capture_output=True, timeout=10, check=True)
                  value = result.stdout.decode("ascii").strip()
                  if not re.fullmatch(r"[0-9a-f]{40}", value):
                      raise ValueError()
                  values.append(value)
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("sha=" + values[0] + "\ntree=" + values[1] + "\n")
          except Exception:
              sys.exit("EXECUTION_IDENTITY_UNAVAILABLE")

      - name: Stage accepted failure index publisher
        id: acceptance_index_stage
        timeout-minutes: 1
        shell: /usr/bin/python3 -I {0}
        env:
          EFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          EFF_RUN_ID: ${{ github.run_id }}
          EFF_ATTEMPT: ${{ github.run_attempt }}
          EFF_SHARD: ${{ matrix.shard }}
          EFF_EXECUTED_SHA: ${{ steps.acceptance_execution_identity.outputs.sha }}
          EFF_TREE: ${{ steps.acceptance_execution_identity.outputs.tree }}
        run: |
          import hashlib, json, os, pathlib, re, signal, subprocess, sys, tempfile, time
          started = time.monotonic()
          def expired(_signal, _frame):
              raise TimeoutError()
          signal.signal(signal.SIGALRM, expired)
          signal.setitimer(signal.ITIMER_REAL, 4.5)
          directory = pathlib.Path(tempfile.mkdtemp(prefix="wiseeff-failure-index-", dir=os.environ["RUNNER_TEMP"]))
          destination = directory / "index.json"
          record = {"schemaVersion": 1, "scope": "accepted-base-failure-index", "status": "unavailable",
                    "code": "BASE_PUBLISHER_UNAVAILABLE", "failures": []}
          publisher_digest = policy_digest = ""
          try:
              base = os.environ.get("EFF_BASE_SHA", "")
              if not re.fullmatch(r"[0-9a-f]{40}", base) or base == "0" * 40:
                  raise ValueError()
              def git(*args, data=None):
                  return subprocess.run(["/usr/bin/git", *args], input=data, capture_output=True, check=True, timeout=3).stdout
              git("merge-base", "--is-ancestor", base, "HEAD")
              publisher = git("show", base + ":scripts/acceptance-failure-index.py")
              record.update(status="rejected", code="POLICY_REJECTED")
              if not 0 < len(publisher) <= 65536:
                  raise ValueError()
              def inventory(revision):
                  rows = git("ls-tree", "-rlz", revision, "--", "e2e/acceptance", "e2e/quality").split(b"\0")
                  return {row.split(b"\t", 1)[1].decode("ascii"): row.split(b"\t", 1)[0].split()[2:4]
                          for row in rows if row and row.startswith(b"100644 blob ")}
              current = inventory("HEAD")
              sources = {}
              matched = [(name, value) for name, value in inventory(base).items()
                         if re.fullmatch(r"e2e/(?:acceptance|quality)/[A-Za-z0-9_./-]+\.spec\.ts", name)
                         and current.get(name) == value]
              if len(matched) > 1000 or sum(int(value[1]) for _, value in matched) > 16777216:
                  raise ValueError()
              blobs = git("cat-file", "--batch", data=b"\n".join(value[0] for _, value in matched) + b"\n") if matched else b""
              for name, value in matched:
                  header, blobs = blobs.split(b"\n", 1)
                  size = int(value[1])
                  if header.split() != [value[0], b"blob", value[1]] or size > 1048576:
                      raise ValueError()
                  source, blobs = blobs[:size].decode("utf-8"), blobs[size + 1:]
                  locations = []
                  for line, content in enumerate(source.splitlines(), 1):
                      for match in re.finditer(r"\btest(?:\.(?:only|skip|fixme))?\s*\(", content):
                          locations.append([line, len(content[:match.start()].encode("utf-16-le")) // 2 + 1])
                  sources[name] = locations
              identity = {key: os.environ.get(env, "") for key, env in
                          (("runId", "EFF_RUN_ID"), ("attempt", "EFF_ATTEMPT"), ("shard", "EFF_SHARD"),
                           ("executedSha", "EFF_EXECUTED_SHA"), ("tree", "EFF_TREE"))}
              policy = json.dumps({"acceptedBase": base, "identity": identity, "sources": sources}, sort_keys=True).encode()
              if len(policy) > 1048576:
                  raise ValueError()
              (directory / "publisher.py").write_bytes(publisher)
              (directory / "policy.json").write_bytes(policy)
              publisher_digest = hashlib.sha256(publisher).hexdigest()
              policy_digest = hashlib.sha256(policy).hexdigest()
              record.update(status="unavailable", code="PUBLICATION_NOT_RUN")
          except Exception:
              pass
          signal.setitimer(signal.ITIMER_REAL, 0)
          destination.write_text(json.dumps(record) + "\n")
          for item in directory.iterdir():
              item.chmod(0o400)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("path=" + str(destination) + "\ndirectory=" + str(directory) + "\n")
              output.write("publisher_digest=" + publisher_digest + "\npolicy_digest=" + policy_digest + "\n")
              output.write("processing_ms=" + str(int((time.monotonic() - started) * 1000) + 1) + "\n")
          sys.exit(1 if record["status"] == "rejected" else 0)

      - name: Set up Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        timeout-minutes: 15
        run: npm ci

      - name: Install and verify DTS toolchain
        timeout-minutes: 20
        uses: ./.github/actions/setup-dts-toolchain

      - name: Advisory DTS seed compile (dtc)
        timeout-minutes: 3
        continue-on-error: true
        run: npm run dtc:seed:compile

      - name: Read Playwright version
        id: playwright_version
        timeout-minutes: 1
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright Chromium
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Acceptance CI metadata
        timeout-minutes: 3
        run: npm run acceptance:ci

      - name: Acceptance state models
        timeout-minutes: 5
        run: npm run acceptance:models

      - name: Owned visual and browser acceptance Gate 0
        id: acceptance_gate0
        timeout-minutes: 65
        run: npm run acceptance:gate0 -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Acceptance artifact safety
        id: acceptance_artifact_safety
        if: always()
        timeout-minutes: 5
        run: npm run acceptance:artifacts:finalize -- --root test-results/acceptance-runtime-runs --output test-results/acceptance-runtime-upload/wiseeff-acceptance-local-non-hdc.zip

      - name: Upload acceptance evidence
        id: acceptance_evidence_upload
        if: always() && steps.acceptance_artifact_safety.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-acceptance-local-non-hdc-shard-${{ matrix.shard }}
          path: test-results/acceptance-runtime-upload/wiseeff-acceptance-local-non-hdc.zip
          if-no-files-found: error
          compression-level: 0

      - name: Generate accepted-base failure index
        id: acceptance_index
        if: always()
        timeout-minutes: 1
        shell: /usr/bin/python3 -I {0}
        env:
          EFF_INDEX_DIRECTORY: ${{ steps.acceptance_index_stage.outputs.directory }}
          EFF_INDEX_STAGE: ${{ steps.acceptance_index_stage.outcome }}
          EFF_INDEX_STAGE_MS: ${{ steps.acceptance_index_stage.outputs.processing_ms }}
          EFF_INDEX_PUBLISHER_DIGEST: ${{ steps.acceptance_index_stage.outputs.publisher_digest }}
          EFF_INDEX_POLICY_DIGEST: ${{ steps.acceptance_index_stage.outputs.policy_digest }}
          EFF_ARCHIVE: ${{ steps.acceptance_artifact_safety.outcome }}
        run: |
          import hashlib, json, os, pathlib, re, stat, subprocess, sys, tempfile, time
          started = time.monotonic()
          directory = pathlib.Path(tempfile.mkdtemp(prefix="wiseeff-index-publication-", dir=os.environ["RUNNER_TEMP"]))
          destination = directory / "index.json"
          record = {"schemaVersion": 1, "scope": "accepted-base-failure-index", "status": "rejected",
                    "code": "INDEX_REJECTED", "failures": []}
          exit_code = 1
          try:
              staged = pathlib.Path(os.environ.get("EFF_INDEX_DIRECTORY", ""))
              if (staged.is_symlink() or not staged.is_dir() or not staged.name.startswith("wiseeff-failure-index-")
                      or staged.parent.resolve() != pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()):
                  raise ValueError()
              if os.environ.get("EFF_INDEX_STAGE") != "success":
                  raise ValueError()
              hashes = [os.environ.get("EFF_INDEX_PUBLISHER_DIGEST", ""), os.environ.get("EFF_INDEX_POLICY_DIGEST", "")]
              if hashes == ["", ""]:
                  record.update(status="unavailable", code="BASE_PUBLISHER_UNAVAILABLE")
                  exit_code = 0
              else:
                  elapsed = os.environ.get("EFF_INDEX_STAGE_MS", "")
                  if not re.fullmatch(r"[0-9]{1,5}", elapsed) or int(elapsed) >= 4500:
                      raise ValueError()
                  for name, expected, limit in zip(("publisher.py", "policy.json"), hashes, (65536, 1048576)):
                      if not re.fullmatch(r"[0-9a-f]{64}", expected):
                          raise ValueError()
                      descriptor = os.open(staged / name, os.O_RDONLY | os.O_NOFOLLOW)
                      with os.fdopen(descriptor, "rb") as source:
                          if not stat.S_ISREG(os.fstat(source.fileno()).st_mode):
                              raise ValueError()
                          content = source.read(limit + 1)
                      if len(content) > limit or hashlib.sha256(content).hexdigest() != expected:
                          raise ValueError()
                      (directory / name).write_bytes(content)
                  if os.environ.get("EFF_ARCHIVE") != "success":
                      record.update(status="unavailable", code="SAFE_ARCHIVE_UNAVAILABLE")
                      exit_code = 0
                  else:
                      budget_ms = 4500 - int(elapsed) - int((time.monotonic() - started) * 1000)
                      if budget_ms <= 0:
                          raise ValueError()
                      result = subprocess.run(["/usr/bin/python3", "-I", str(directory / "publisher.py"),
                                               "test-results/acceptance-runtime-upload/wiseeff-acceptance-local-non-hdc.zip",
                                               str(directory / "policy.json"), str(destination)],
                                              env={"PATH": "/usr/bin:/bin", "WISEEFF_FAILURE_INDEX_BUDGET_MS": str(budget_ms)},
                                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=budget_ms / 1000 + 0.2)
                      if destination.is_symlink() or not destination.is_file() or destination.stat().st_size > 262144:
                          raise ValueError()
                      record = json.loads(destination.read_bytes())
                      if record.get("status") not in ("generated", "unavailable", "rejected"):
                          raise ValueError()
                      exit_code = result.returncode
          except Exception:
              record = {"schemaVersion": 1, "scope": "accepted-base-failure-index", "status": "rejected",
                        "code": "INDEX_REJECTED", "failures": []}
          if record.get("code") not in ("INDEX_GENERATED", "REPORT_UNAVAILABLE", "BASE_PUBLISHER_UNAVAILABLE", "SAFE_ARCHIVE_UNAVAILABLE", "INDEX_REJECTED"):
              record = {"schemaVersion": 1, "scope": "accepted-base-failure-index", "status": "rejected",
                        "code": "INDEX_REJECTED", "failures": []}
              exit_code = 1
          destination.write_text(json.dumps(record) + "\n")
          destination.chmod(0o400)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("path=" + str(destination) + "\n")
              output.write("code=" + record["code"] + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("Compact acceptance failure index: " + record["code"] + ". Diagnostic data; not acceptance.\n")
          sys.exit(exit_code)

      - name: Upload compact failure index
        id: acceptance_index_upload
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-failure-index-${{ github.run_id }}-${{ github.run_attempt }}-acceptance-local-non-hdc-shard-${{ matrix.shard }}
          path: ${{ steps.acceptance_index.outputs.path }}
          if-no-files-found: error

      # Bootstrap publisher: only workflow-owned context, never candidate files,
      # reports, titles, paths, exceptions or environment dumps. Internal cleanup
      # and phase facts remain unknown until an accepted-base publisher exists.
      - name: Generate minimal acceptance diagnostic
        id: acceptance_diagnostic
        if: always()
        timeout-minutes: 1
        shell: /usr/bin/python3 -I {0}
        env:
          EFF_RUN_ID: ${{ github.run_id }}
          EFF_ATTEMPT: ${{ github.run_attempt }}
          EFF_SHARD: ${{ matrix.shard }}
          EFF_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          EFF_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EFF_EXECUTED_SHA: ${{ steps.acceptance_execution_identity.outputs.sha }}
          EFF_TREE: ${{ steps.acceptance_execution_identity.outputs.tree }}
          EFF_EXECUTION: ${{ steps.acceptance_gate0.outcome }}
          EFF_ARCHIVE: ${{ steps.acceptance_artifact_safety.outcome }}
          EFF_UPLOAD: ${{ steps.acceptance_evidence_upload.outcome }}
        run: |
          import datetime, json, os, pathlib, re, sys, tempfile
          try:
              def identity(key, pattern):
                  value = os.environ.get(key, "")
                  if value == "":
                      return None
                  if not re.fullmatch(pattern, value):
                      raise ValueError()
                  return value

              def outcome(key):
                  value = os.environ.get(key, "")
                  if value not in ("", "success", "failure", "cancelled", "skipped"):
                      raise ValueError()
                  return value or "unknown"

              record = {
                  "schemaVersion": 1, "scope": "workflow-context-only",
                  "identity": {
                      "runId": identity("EFF_RUN_ID", r"[1-9][0-9]{0,19}"),
                      "attempt": identity("EFF_ATTEMPT", r"[1-9][0-9]{0,9}"),
                      "job": "acceptance-local-non-hdc-shard-" + identity("EFF_SHARD", r"[1-4]"),
                      "workflowSha": identity("EFF_WORKFLOW_SHA", r"[0-9a-f]{40}"),
                      "acceptedBase": identity("EFF_BASE", r"[0-9a-f]{40}"),
                      "prHead": identity("EFF_PR_HEAD", r"[0-9a-f]{40}"),
                      "executedSha": identity("EFF_EXECUTED_SHA", r"[0-9a-f]{40}"),
                      "tree": identity("EFF_TREE", r"[0-9a-f]{40}"),
                  },
                  "states": {
                      "execution": outcome("EFF_EXECUTION"), "cleanup": "unknown",
                      "diagnostic": "generated", "archive": outcome("EFF_ARCHIVE"),
                      "upload": outcome("EFF_UPLOAD"), "diagnosticUpload": "pending",
                  },
                  "firstFailedStage": None, "code": "WORKFLOW_SNAPSHOT",
                  "exitCode": None, "signal": None, "startedAt": None,
                  "recordedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "testCounts": None, "failureIds": [], "detailsSuppressed": True,
                  "missingEvidence": ["phase-details", "cleanup", "test-counts", "diagnostic-upload-terminal"],
              }
              for stage in ("execution", "archive", "upload"):
                  if record["states"][stage] == "failure":
                      record["firstFailedStage"] = stage
                      record["code"] = stage.upper() + "_FAILED"
                      break
              if record["states"]["execution"] in ("unknown", "skipped", "cancelled") or any(
                      value is None for value in record["identity"].values()):
                  record["code"] = "EXECUTION_INCOMPLETE"
              payload = json.dumps(record, indent=2) + "\n"
              summary = "Acceptance diagnostic: " + record["code"] + "\n\n" + json.dumps(record["states"]) + "\n"
              if len(payload.encode()) > 65536 or len(summary.encode()) > 4096:
                  raise ValueError()
              root = os.environ["RUNNER_TEMP"]
              if "\n" in root or "\r" in root:
                  raise ValueError()
              directory = pathlib.Path(tempfile.mkdtemp(prefix="wiseeff-diagnostic-", dir=root))
              destination = directory / "diagnostic.json"
              with destination.open("x") as output:
                  output.write(payload)
              destination.chmod(0o600)
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("path=" + str(destination) + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write(summary)
          except Exception:
              sys.exit("DIAGNOSTIC_REJECTED")

      - name: Generate fixed diagnostic rejection
        id: acceptance_diagnostic_fallback
        if: always() && steps.acceptance_diagnostic.outcome != 'success'
        timeout-minutes: 1
        shell: /usr/bin/python3 -I {0}
        env:
          EFF_RUN_ID: ${{ github.run_id }}
          EFF_ATTEMPT: ${{ github.run_attempt }}
          EFF_SHARD: ${{ matrix.shard }}
        run: |
          import json, os, pathlib, re, sys, tempfile
          try:
              def number(key, pattern):
                  value = os.environ.get(key, "")
                  return value if re.fullmatch(pattern, value) else None
              record = {"schemaVersion": 1, "scope": "workflow-context-only",
                        "identity": {"runId": number("EFF_RUN_ID", r"[1-9][0-9]{0,19}"),
                                     "attempt": number("EFF_ATTEMPT", r"[1-9][0-9]{0,9}"),
                                     "job": "acceptance-local-non-hdc-shard-" + (number("EFF_SHARD", r"[1-4]") or "unknown")},
                        "code": "DIAGNOSTIC_REJECTED", "detailsSuppressed": True}
              root = os.environ["RUNNER_TEMP"]
              if "\n" in root or "\r" in root:
                  raise ValueError()
              directory = pathlib.Path(tempfile.mkdtemp(prefix="wiseeff-diagnostic-rejected-", dir=root))
              destination = directory / "diagnostic.json"
              with destination.open("x") as output:
                  output.write(json.dumps(record) + "\n")
              destination.chmod(0o600)
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("path=" + str(destination) + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write("Acceptance diagnostic: DIAGNOSTIC_REJECTED\n")
          except Exception:
              sys.exit("DIAGNOSTIC_REJECTED")

      - name: Upload minimal acceptance diagnostic
        id: acceptance_diagnostic_upload
        if: always() && (steps.acceptance_diagnostic.outcome == 'success' || steps.acceptance_diagnostic_fallback.outcome == 'success')
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-acceptance-local-non-hdc-shard-${{ matrix.shard }}
          path: ${{ steps.acceptance_diagnostic.outcome == 'success' && steps.acceptance_diagnostic.outputs.path || steps.acceptance_diagnostic_fallback.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Settle diagnostic upload outcome
        id: acceptance_diagnostic_settle
        if: always()
        timeout-minutes: 1
        shell: /usr/bin/python3 -I {0}
        env:
          EFF_UPLOAD: ${{ steps.acceptance_diagnostic_upload.outcome }}
          EFF_INDEX_UPLOAD: ${{ steps.acceptance_index_upload.outcome }}
          EFF_INDEX_CODE: ${{ steps.acceptance_index.outputs.code }}
          EFF_INDEX_URL: ${{ steps.acceptance_index_upload.outputs.artifact-url }}
          EFF_ARCHIVE_UPLOAD: ${{ steps.acceptance_evidence_upload.outcome }}
          EFF_ARCHIVE_URL: ${{ steps.acceptance_evidence_upload.outputs.artifact-url }}
          EFF_SERVER: ${{ github.server_url }}
          EFF_REPOSITORY: ${{ github.repository }}
          EFF_RUN_ID: ${{ github.run_id }}
          EFF_ATTEMPT: ${{ github.run_attempt }}
          EFF_SHARD: ${{ matrix.shard }}
          EFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          EFF_EXECUTED_SHA: ${{ steps.acceptance_execution_identity.outputs.sha }}
          EFF_TREE: ${{ steps.acceptance_execution_identity.outputs.tree }}
        run: |
          import os, re, sys
          try:
              status = os.environ.get("EFF_UPLOAD", "")
              if status not in ("success", "failure", "cancelled", "skipped"):
                  status = "unknown"
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write("Minimal diagnostic upload: " + status + "\n")
                  try:
                      def known(key, pattern):
                          value = os.environ.get(key, "")
                          if not re.fullmatch(pattern, value):
                              raise ValueError()
                          return value
                      run = known("EFF_RUN_ID", r"[1-9][0-9]{0,19}")
                      attempt = known("EFF_ATTEMPT", r"[1-9][0-9]{0,9}")
                      shard = known("EFF_SHARD", r"[1-4]")
                      server = known("EFF_SERVER", r"https://[A-Za-z0-9.-]+")
                      repository = known("EFF_REPOSITORY", r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+")
                      def artifact(key, outcome):
                          value = os.environ.get(key, "")
                          prefix = server + "/" + repository + "/actions/runs/" + run + "/artifacts/"
                          return value if os.environ.get(outcome) == "success" and value.startswith(prefix) and re.fullmatch(r"[1-9][0-9]{0,19}", value[len(prefix):]) else None
                      code = os.environ.get("EFF_INDEX_CODE", "")
                      if code not in ("INDEX_GENERATED", "REPORT_UNAVAILABLE", "BASE_PUBLISHER_UNAVAILABLE", "SAFE_ARCHIVE_UNAVAILABLE", "INDEX_REJECTED"):
                          code = "INDEX_UNAVAILABLE"
                      output.write("\nDiagnostic navigation — run " + run + " / attempt " + attempt + " / shard " + shard + ".\n\n")
                      for key, label in (("EFF_HEAD_SHA", "PR/push head"), ("EFF_EXECUTED_SHA", "Observed checkout"), ("EFF_BASE_SHA", "Accepted base"), ("EFF_TREE", "Observed tree")):
                          value = os.environ.get(key, "")
                          output.write(label + ": `" + (value if re.fullmatch(r"[0-9a-f]{40}", value) else "unknown") + "`\n\n")
                      for key, label, outcome in (("EFF_INDEX_URL", "Compact failure index (" + code + ")", "EFF_INDEX_UPLOAD"),
                                                  ("EFF_ARCHIVE_URL", "Full sanitized archive", "EFF_ARCHIVE_UPLOAD")):
                          url = artifact(key, outcome)
                          output.write(("[" + label + "](" + url + ")" if url else label + ": unavailable") + "\n\n")
                      output.write("Diagnostic data only; failure classification stays unknown until investigated. Current head/checks and human approval remain separate.\n")
                  except Exception:
                      output.write("Compact index navigation unavailable: missing or invalid workflow context. No raw-log fallback.\n")
              if status != "success":
                  sys.exit(1)
          except Exception:
              sys.exit("DIAGNOSTIC_UPLOAD_INCOMPLETE")

  acceptance-local-non-hdc:
    name: Acceptance local non-HDC
    if: always() && needs.detect.outputs.selected != 'false'
    needs: [detect, acceptance-local-non-hdc-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify every L2 shard result
        env:
          EFF_NEEDS: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/ci-required-results.ts l2

  target-synthetic-acceptance:
    name: Target synthetic acceptance
    needs: detect
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_mode != 'local-non-hdc' && inputs.acceptance_mode != 'minimal-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      WISEEFF_API_BASE_URL: ${{ secrets.WISEEFF_API_BASE_URL }}
      VITE_WISEEFF_API_BASE_URL: ${{ secrets.WISEEFF_API_BASE_URL }}
      WISEEFF_ACCEPTANCE_FRONTEND_URL: ${{ inputs.frontend_url }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_MODE: production
      AUTH_TOKEN_ISSUER: ${{ secrets.AUTH_TOKEN_ISSUER }}
      AUTH_TOKEN_HMAC_SECRET: ${{ secrets.AUTH_TOKEN_HMAC_SECRET }}
      M5_SMOKE_AUTHORIZATION: ${{ secrets.M5_SMOKE_AUTHORIZATION }}
      WISEEFF_SMOKE_AUTHORIZATION: ${{ secrets.WISEEFF_SMOKE_AUTHORIZATION }}
      DEBUG_DEVICE_GATEWAY_MODE: ${{ vars.DEBUG_DEVICE_GATEWAY_MODE }}
      HDC_DEVICE_LAB_AVAILABLE: ${{ vars.HDC_DEVICE_LAB_AVAILABLE }}
      HDC_SMOKE_PROJECT_ID: ${{ vars.HDC_SMOKE_PROJECT_ID }}
      HDC_SMOKE_DEVICE_ID: ${{ vars.HDC_SMOKE_DEVICE_ID }}
      HDC_SMOKE_TARGET_REF: ${{ vars.HDC_SMOKE_TARGET_REF }}
      HDC_SMOKE_PARAMETER_ID: ${{ vars.HDC_SMOKE_PARAMETER_ID }}
      HDC_SMOKE_NODE_PATH: ${{ vars.HDC_SMOKE_NODE_PATH }}
      HDC_SMOKE_WRITE_VALUE: ${{ vars.HDC_SMOKE_WRITE_VALUE }}
      M5_DEVICE_GATEWAY_EVIDENCE: ${{ vars.M5_DEVICE_GATEWAY_EVIDENCE }}
      M5_BACKUP_RESTORE_DRILL_AT: ${{ vars.M5_BACKUP_RESTORE_DRILL_AT }}
      M5_CONTRACT_CHECK_PASSED: ${{ vars.M5_CONTRACT_CHECK_PASSED }}
      WISEEFF_QUALITY_SKIP_SEED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Playwright version
        id: playwright_version
        timeout-minutes: 1
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare target acceptance env
        shell: bash
        run: |
          target_env="${{ inputs.env_file }}"
          frontend_url="${WISEEFF_ACCEPTANCE_FRONTEND_URL:-https://example.invalid}"
          {
            echo "WISEEFF_API_BASE_URL=${WISEEFF_API_BASE_URL}"
            echo "VITE_WISEEFF_RUNTIME_MODE=api"
            echo "VITE_WISEEFF_API_BASE_URL=${VITE_WISEEFF_API_BASE_URL}"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "AUTH_MODE=production"
            echo "AUTH_TOKEN_ISSUER=${AUTH_TOKEN_ISSUER}"
            echo "AUTH_TOKEN_HMAC_SECRET=${AUTH_TOKEN_HMAC_SECRET}"
            echo "M5_SMOKE_AUTHORIZATION=${M5_SMOKE_AUTHORIZATION:-${WISEEFF_SMOKE_AUTHORIZATION}}"
            echo "WISEEFF_SMOKE_AUTHORIZATION=${WISEEFF_SMOKE_AUTHORIZATION:-${M5_SMOKE_AUTHORIZATION}}"
            echo "DEBUG_DEVICE_GATEWAY_MODE=${DEBUG_DEVICE_GATEWAY_MODE:-simulator}"
            echo "HDC_DEVICE_LAB_AVAILABLE=${HDC_DEVICE_LAB_AVAILABLE:-false}"
            echo "HDC_SMOKE_PROJECT_ID=${HDC_SMOKE_PROJECT_ID}"
            echo "HDC_SMOKE_DEVICE_ID=${HDC_SMOKE_DEVICE_ID}"
            echo "HDC_SMOKE_TARGET_REF=${HDC_SMOKE_TARGET_REF}"
            echo "HDC_SMOKE_PARAMETER_ID=${HDC_SMOKE_PARAMETER_ID}"
            echo "HDC_SMOKE_NODE_PATH=${HDC_SMOKE_NODE_PATH}"
            echo "HDC_SMOKE_WRITE_VALUE=${HDC_SMOKE_WRITE_VALUE}"
            echo "M5_DEVICE_GATEWAY_EVIDENCE=${M5_DEVICE_GATEWAY_EVIDENCE}"
            echo "M5_BACKUP_RESTORE_DRILL_AT=${M5_BACKUP_RESTORE_DRILL_AT}"
            echo "M5_CONTRACT_CHECK_PASSED=${M5_CONTRACT_CHECK_PASSED:-true}"
          } > "${target_env}"
          echo "WISEEFF_ACCEPTANCE_FRONTEND_URL=${frontend_url}" >> "$GITHUB_ENV"

      - name: Acceptance CI metadata
        run: npm run acceptance:ci

      - name: Acceptance state models
        run: npm run acceptance:models

      - name: Acceptance quality metadata
        run: npm run acceptance:quality

      - name: Acceptance quality gates
        run: npm run acceptance:quality-run
        env:
          WISEEFF_ACCEPTANCE_NO_START_RUNTIME: "true"

      - name: Browser acceptance target non-HDC
        if: inputs.acceptance_mode == 'target-non-hdc'
        run: npm run acceptance:browser -- --mode target-non-hdc --no-start-runtime --env-file "${{ inputs.env_file }}" --frontend-url "${WISEEFF_ACCEPTANCE_FRONTEND_URL}"

      - name: Browser acceptance full pilot
        if: inputs.acceptance_mode == 'full-pilot'
        run: npm run acceptance:browser -- --mode full-pilot --no-start-runtime --env-file "${{ inputs.env_file }}" --frontend-url "${WISEEFF_ACCEPTANCE_FRONTEND_URL}"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiseeff-acceptance-${{ inputs.acceptance_mode }}
          path: |
            playwright-report/acceptance
            test-results/acceptance
            docs/generated/acceptance-browser-evidence.md
            docs/generated/acceptance-operation-evidence.md
            docs/generated/acceptance-operation-evidence/index.json
            playwright-report/quality
            test-results/quality

  required:
    name: Merge bar${{ needs.detect.outputs.selected == 'false' && ' (ignored label)' || '' }}
    if: always()
    needs:
      - detect
      - build-and-test
      - acceptance-quality
      - acceptance-smoke
      - acceptance-local-non-hdc
      - target-synthetic-acceptance
      - minimal-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: needs.detect.outputs.selected != 'false'
      - uses: actions/setup-node@v4
        if: needs.detect.outputs.selected != 'false'
        with:
          node-version-file: .nvmrc
      - name: Check jobs that were supposed to run
        if: needs.detect.outputs.selected != 'false'
        env:
          EFF_NEEDS: ${{ toJSON(needs) }}
        run: node --experimental-strip-types scripts/ci-required-results.ts required
