global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: wiseeff
    environment: self-hosted

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: wiseeff-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:8787
        labels:
          component: api

  # The worker target is reserved for the durable queue runtime that exposes
  # worker/process metrics on the private operations network.
  - job_name: wiseeff-worker
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - worker:8788
        labels:
          component: worker

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          component: observability

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          component: observability

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
        labels:
          component: observability

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115
        labels:
          component: observability

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          component: postgres

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          component: redis

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          component: host

  - job_name: wiseeff-service-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://api:8787/health/live
        labels:
          service: api
      - targets:
          - http://worker:8788/health/live
        labels:
          service: worker
      - targets:
          - http://web:5173/
        labels:
          service: web
      - targets:
          - http://proxy/health/live
        labels:
          service: proxy
      - targets:
          - http://minio:9000/minio/health/live
        labels:
          service: object-store
      - targets:
          - http://prometheus:9090/-/ready
        labels:
          service: prometheus
      - targets:
          - http://alertmanager:9093/-/ready
        labels:
          service: alertmanager
      - targets:
          - http://grafana:3000/api/health
        labels:
          service: grafana
      - targets:
          - http://blackbox-exporter:9115/-/healthy
        labels:
          service: blackbox-exporter
      - targets:
          - http://node-exporter:9100/metrics
        labels:
          service: node-exporter
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: wiseeff-service-tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - postgres:5432
        labels:
          service: postgres
      - targets:
          - redis:6379
        labels:
          service: redis
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
