x-wiseeff-build: &wiseeff-build
  context: ../..
  dockerfile: ops/self-hosted/Dockerfile
  args:
    VITE_WISEEFF_RUNTIME_MODE: api
    VITE_WISEEFF_API_BASE_URL: ${VITE_WISEEFF_API_BASE_URL:?set VITE_WISEEFF_API_BASE_URL in ops/self-hosted/.env}
    HTTP_PROXY:
    HTTPS_PROXY:
    ALL_PROXY:
    NO_PROXY:
    http_proxy:
    https_proxy:
    all_proxy:
    no_proxy:
    WISEEFF_NPM_REGISTRY:
  secrets:
    - wiseeff-corporate-ca

x-wiseeff-image: &wiseeff-image "${WISEEFF_APP_IMAGE:-wiseeff-app}:${WISEEFF_APP_TAG:-local}"

x-wiseeff-runtime-proxy: &wiseeff-runtime-proxy
  HTTP_PROXY: ${WISEEFF_RUNTIME_HTTP_PROXY:-}
  HTTPS_PROXY: ${WISEEFF_RUNTIME_HTTPS_PROXY:-}
  ALL_PROXY: ${WISEEFF_RUNTIME_ALL_PROXY:-}
  NO_PROXY: ${WISEEFF_RUNTIME_NO_PROXY:-}
  http_proxy: ${WISEEFF_RUNTIME_HTTP_PROXY:-}
  https_proxy: ${WISEEFF_RUNTIME_HTTPS_PROXY:-}
  all_proxy: ${WISEEFF_RUNTIME_ALL_PROXY:-}
  no_proxy: ${WISEEFF_RUNTIME_NO_PROXY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    env_file: ${WISEEFF_ENV_FILE:-.env}
    environment:
      POSTGRES_USER: wiseeff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ops/self-hosted/.env}
      POSTGRES_DB: wiseeff
    volumes:
      - wiseeff-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiseeff -d wiseeff"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - wiseeff-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in ops/self-hosted/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in ops/self-hosted/.env}
    volumes:
      - wiseeff-minio-data:/data
    expose:
      - "9000"
      - "9001"

  minio-init:
    image: minio/mc:latest
    mem_limit: 128m
    memswap_limit: 128m
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done &&
      mc mb --ignore-existing local/wiseeff &&
      mc mb --ignore-existing local/wiseeff-restore &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  api:
    image: *wiseeff-image
    build: *wiseeff-build
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    env_file: ${WISEEFF_ENV_FILE:-.env}
    environment:
      <<: *wiseeff-runtime-proxy
      HOST: 0.0.0.0
      PORT: 8787
      LOG_WORKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8787"
    volumes:
      - ./bridge-artifacts:/app/ops/self-hosted/bridge-artifacts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: ["sh", "-lc", "npm run db:migrate && npx tsx server/index.ts"]

  worker:
    image: *wiseeff-image
    build: *wiseeff-build
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 576m
    env_file: ${WISEEFF_ENV_FILE:-.env}
    environment:
      <<: *wiseeff-runtime-proxy
      LOG_WORKER_ENABLED: "true"
      LOG_WORKER_OBSERVABILITY_HOST: 0.0.0.0
      LOG_WORKER_OBSERVABILITY_PORT: 8788
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    expose:
      - "8788"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8788/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: ["sh", "-lc", "npm run worker:logs"]

  web:
    image: *wiseeff-image
    build: *wiseeff-build
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    env_file: ${WISEEFF_ENV_FILE:-.env}
    environment:
      VITE_WISEEFF_RUNTIME_MODE: api
      VITE_WISEEFF_API_BASE_URL: ${VITE_WISEEFF_API_BASE_URL}
    expose:
      - "5173"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: ["sh", "-lc", "npm run preview -- --host 0.0.0.0 --port 5173 --strictPort"]

  proxy:
    image: caddy:2-alpine
    init: true
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 96m
    env_file: ${WISEEFF_ENV_FILE:-.env}
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./${WISEEFF_CADDYFILE:-Caddyfile.example}:/etc/caddy/Caddyfile:ro
      - ./bridge-artifacts:/bridge-artifacts:ro
      - ./bridge-tool-artifacts:/bridge-tool-artifacts:ro
      - wiseeff-caddy-data:/data
      - wiseeff-caddy-config:/config
    healthcheck:
      # Use Caddy admin over plain HTTP to avoid BusyBox wget → ssl_client zombie leak
      # when HTTP→HTTPS redirects would otherwise force an HTTPS fetch (see busybox #15967).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    ports:
      - "127.0.0.1:${WISEEFF_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - wiseeff-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${WISEEFF_PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle

  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m
    ports:
      - "127.0.0.1:${WISEEFF_ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - wiseeff-alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${WISEEFF_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wiseeff-services.json
    volumes:
      - ./observability/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./observability/grafana/provisioning/dashboards/wiseeff.yml:/etc/grafana/provisioning/dashboards/wiseeff.yml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - wiseeff-grafana-data:/var/lib/grafana

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 96m
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 96m
    pid: host
    volumes:
      - /:/host:ro
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 96m
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL}

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 96m
    environment:
      REDIS_ADDR: redis://redis:6379

volumes:
  wiseeff-postgres-data:
  wiseeff-redis-data:
  wiseeff-minio-data:
  wiseeff-caddy-data:
  wiseeff-caddy-config:
  wiseeff-prometheus-data:
  wiseeff-alertmanager-data:
  wiseeff-grafana-data:

secrets:
  wiseeff-corporate-ca:
    file: ${WISEEFF_BUILD_CA_CERT_FILE:-./build-network/empty-ca.pem}
