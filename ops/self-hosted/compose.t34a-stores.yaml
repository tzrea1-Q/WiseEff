# Isolated T3.4a three-store rehearsal. Not compose 5432/wiseeff. Not wiseeff_lane_849.
#   docker compose -p wiseeff-t34a-stores -f ops/self-hosted/compose.t34a-stores.yaml up -d
name: wiseeff-t34a-stores

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wiseeff-t34a-pg
    environment:
      POSTGRES_USER: wiseeff
      POSTGRES_PASSWORD: wiseeff
      POSTGRES_DB: wiseeff_t34a
    ports:
      - "127.0.0.1:55441:5432"
    volumes:
      - wiseeff-t34a-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiseeff -d wiseeff_t34a"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: wiseeff-t34a-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - wiseeff-t34a-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: wiseeff/minio:RELEASE.2024-12-18T13-15-44Z
    pull_policy: never
    build: &minio-build
      context: ../..
      dockerfile: ops/self-hosted/images/minio/Dockerfile
      target: minio
      args: &minio-build-args
        BINARY: minio
        BINARY_URL: https://github.com/minio/minio/releases/download/RELEASE.2024-12-18T13-15-44Z/minio.linux-amd64.RELEASE.2024-12-18T13-15-44Z
        HTTP_PROXY:
        HTTPS_PROXY:
        ALL_PROXY:
        NO_PROXY:
        http_proxy:
        https_proxy:
        all_proxy:
        no_proxy:
        WISEEFF_BUILD_TLS_POLICY: ${WISEEFF_BUILD_TLS_POLICY:-verify}
        WISEEFF_BUILD_TLS_ACK: ${WISEEFF_BUILD_TLS_ACK:-}
        WISEEFF_BUILD_TRANSPORT_FINGERPRINT: ${WISEEFF_BUILD_TRANSPORT_FINGERPRINT:-unmanaged-verified}
      secrets:
        - wiseeff-corporate-ca
    container_name: wiseeff-t34a-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: t34a-minio
      MINIO_ROOT_PASSWORD: t34a-minio-secret-32chars
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - wiseeff-t34a-minio-data:/data

  minio-init:
    image: wiseeff/mc:RELEASE.2024-11-21T17-21-54Z
    pull_policy: never
    build:
      <<: *minio-build
      target: mc
      args:
        <<: *minio-build-args
        BINARY: mc
        BINARY_URL: https://github.com/minio/mc/releases/download/RELEASE.2024-11-21T17-21-54Z/mc.linux-amd64.RELEASE.2024-11-21T17-21-54Z
    container_name: wiseeff-t34a-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: t34a-minio
      MINIO_ROOT_PASSWORD: t34a-minio-secret-32chars
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done &&
      mc mb --ignore-existing local/wiseeff-t34a &&
      mc mb --ignore-existing local/wiseeff-t34a-restore &&
      exit 0
      "
    restart: "no"

volumes:
  wiseeff-t34a-pg-data:
  wiseeff-t34a-redis-data:
  wiseeff-t34a-minio-data:

secrets:
  wiseeff-corporate-ca:
    file: ${WISEEFF_BUILD_CA_CERT_FILE:-./build-network/empty-ca.pem}
