# Isolated Catalog delivery overlay. Merged on top of ops/self-hosted/compose.yaml.
# Does not start the shared compose postgres:16-alpine (127.0.0.1:5432/wiseeff).
# API/worker/manager connect to an ephemeral pgvector database via host.docker.internal.
services:
  postgres:
    profiles: ["stock-postgres"]

  proxy:
    ports: !override
      - "127.0.0.1:${WISEEFF_ISOLATED_PUBLIC_PORT:-18080}:80"
    environment:
      WISEEFF_SITE_HOST: 127.0.0.1

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z

  api:
    depends_on: !override
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${WISEEFF_ISOLATED_API_PORT:-18787}:8787"
    environment:
      AUTH_MODE: production
      AUTH_PROVIDER: local
      HOST: 0.0.0.0
      WISEEFF_API_PROCESS: "1"
      LOG_WORKER_ENABLED: "false"
    command: ["sh", "-lc", "npx tsx server/index.ts"]

  worker:
    depends_on: !override
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${WISEEFF_WORKER_DATABASE_URL}
      LOG_WORKER_ENABLED: "true"

  publication-manager:
    depends_on: !override
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    ports:
      - "127.0.0.1:${WISEEFF_ISOLATED_WEB_PORT:-15173}:5173"
